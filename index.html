    <h2>Bugün yediklerim</h2>

<script>
  // ---- YARDIMCILAR ----
  // Türkçe harfleri sadeleştir: "salatalık" -> "salatalik" (eşleşme için)
  function duzelt(metin) {
    return metin.toLocaleLowerCase("tr")
      .replace(/ç/g, "c")
      .replace(/ğ/g, "g")
      .replace(/ı/g, "i")
      .replace(/ö/g, "o")
      .replace(/ş/g, "s")
      .replace(/ü/g, "u");
  }

  // 1 adet/kase/bardak ≈ kaç gram (tablosu olmayanda 100 gram varsayar)
  const ADET_GRAM = {
    "yumurta": 50,
    "muz": 120,
    "elma": 150,
    "simit": 100,
    "kola": 250,
    "domates": 120,
    "salatalık": 100,
    "süt": 200,
    "yoğurt": 200,
    "ayran": 200,
    "mercimek çorbası": 250
  };

  function bugun() {
    const d = new Date();
    return d.getFullYear() + "-" +
      String(d.getMonth() + 1).padStart(2, "0") + "-" +
      String(d.getDate()).padStart(2, "0");
  }

  function kayitlariAl() {
    return JSON.parse(localStorage.getItem("kaloriKayitlari") || "[]");
  }

  function kayitlariKaydet(liste) {
    localStorage.setItem("kaloriKayitlari", JSON.stringify(liste));
  }

  function ozelYemekleriAl() {
    return JSON.parse(localStorage.getItem("ozelYemekler") || "{}");
  }

  // Gömülü liste + sonradan eklediklerin
  function tumYemekler() {
    return Object.assign({}, YEMEKLER, ozelYemekleriAl());
  }

  // Kayda ekle, hesabı döndür
  function ekle(ad, gram) {
    const deger = tumYemekler()[ad];
    const kalori = Math.round(deger[0] * gram / 100);
    const protein = Math.round(deger[1] * gram / 100 * 10) / 10;
    const liste = kayitlariAl();
    liste.push({
      tarih: bugun(),
      saat: new Date().toTimeString().slice(0, 5),
      yemek: ad,
      gram: gram,
      kalori: kalori,
      protein: protein
    });
    kayitlariKaydet(liste);
    return { kalori: kalori, protein: protein };
  }

  // ---- AKILLI GİRİŞ ----
  const giris = document.getElementById("giris");
  const sonuc = document.getElementById("sonuc");

  // Metindeki yemek adını bul (en uzun eşleşme kazanır)
  function yemekBul(metin) {
    const m = duzelt(metin);
    const adlar = Object.keys(tumYemekler()).sort(function (a, b) {
      return b.length - a.length;
    });
    for (const ad of adlar) {
      if (m.includes(duzelt(ad))) return ad;
    }
    return null;
  }

  function akilliEkle() {
    let metin = giris.value.toLocaleLowerCase("tr").replace(/\bbir\b/g, "1");
    sonuc.textContent = "";
    if (!metin.trim()) return;

    const sayiM = metin.match(/\d+/);
    if (!sayiM) {
      sonuc.textContent = "Miktar bulamadım. Örnek: 200 gr salatalık yedim";
      return;
    }
    const miktar = parseInt(sayiM[0]);

    const ad = yemekBul(metin);
    if (!ad) {
      manuelAc(giris.value);
      return;
    }

    // KURAL: "gr/gram" veya birim yoksa HER ZAMAN gram ("20 salatalık" = 20 g).
    // Birim kelimesi varsa (adet/tane/fincan/bardak/dilim/kase/kaşık) adet say:
    // "20 fincan kahve" = 20 x 100 g, "2 bardak süt" = 2 x 200 g.
    let gram = miktar;
    const adetYazilmis = /adet|tane|fincan|bardak|dilim|kase|kaşık/.test(metin);
    if (adetYazilmis) {
      gram = miktar * (ADET_GRAM[ad] || 100);
    }

    const s = ekle(ad, gram);
    sonuc.textContent = "✓ Eklendi: " + gram + " g " + ad + " — " + s.kalori + " kcal, " + s.protein + " g protein";
    giris.value = "";
  }

  document.getElementById("ekleBtn").addEventListener("click", akilliEkle);
  giris.addEventListener("keydown", function (e) {
    if (e.key === "Enter") akilliEkle();
  });

  // ---- TANINMAYAN YEMEK: MANUEL FORM ----
  const manuelForm = document.getElementById("manuelForm");
  const secYemek = document.getElementById("secYemek");
  const secGram = document.getElementById("secGram");
  const yeniSatir = document.getElementById("yeniSatir");
  const yeniAd = document.getElementById("yeniAd");
  const yeniKal = document.getElementById("yeniKal");
  const yeniPro = document.getElementById("yeniPro");

  function secListesiniYenile() {
    secYemek.innerHTML = "";
    const adlar = Object.keys(tumYemekler()).sort(function (a, b) {
      return a.localeCompare(b, "tr");
    });
    for (const ad of adlar) {
      const o = document.createElement("option");
      o.value = ad;
      o.textContent = ad;
      secYemek.appendChild(o);
    }
    const y = document.createElement("option");
    y.value = "__yeni__";
    y.textContent = "— Listede yok, yeni yemek ekleyeceğim —";
    secYemek.appendChild(y);
  }

  function yeniAcKapa() {
    yeniSatir.style.display = secYemek.value === "__yeni__" ? "block" : "none";
  }

  function manuelAc(orijinalMetin) {
    secListesiniYenile();
    yeniAcKapa();
    const s = orijinalMetin.match(/\d+/);
    secGram.value = s ? s[0] : "";
    manuelForm.style.display = "block";
    sonuc.textContent = "Bu yemeği tanımadım — aşağıdan seç:";
  }

  secYemek.addEventListener("change", yeniAcKapa);
  secGram.addEventListener("keydown", function (e) {
    if (e.key === "Enter") document.getElementById("manuelBtn").click();
  });

  document.getElementById("manuelBtn").addEventListener("click", function () {
    const gram = parseInt(secGram.value);
    if (!gram) {
      sonuc.textContent = "Gram değerini yaz.";
      return;
    }
    let ad;
    if (secYemek.value === "__yeni__") {
      ad = yeniAd.value.trim().toLocaleLowerCase("tr");
      const kal = parseFloat(yeniKal.value);
      const pro = parseFloat(yeniPro.value);
      if (!ad || isNaN(kal)) {
        sonuc.textContent = "Yeni yemek için ad ve kalori gerekli.";
        return;
      }
      const ozel = ozelYemekleriAl();
      ozel[ad] = [kal, isNaN(pro) ? 0 : pro];
      localStorage.setItem("ozelYemekler", JSON.stringify(ozel));
    } else {
      ad = secYemek.value;
    }
    const s = ekle(ad, gram);
    sonuc.textContent = "✓ Eklendi: " + gram + " g " + ad + " — " + s.kalori + " kcal, " + s.protein + " g protein";
    manuelForm.style.display = "none";
    giris.value = "";
  });
</script>
<script>
  // ---- GÜNÜN LİSTESİ ----
  const gunListesi = document.getElementById("gunListesi");

  function listeyiCiz() {
    const hepsi = kayitlariAl();
    const b = bugun();
    gunListesi.innerHTML = "";
    for (let i = 0; i < hepsi.length; i++) {
      const k = hepsi[i];
      if (k.tarih !== b) continue;
      const li = document.createElement("li");
      li.textContent = k.saat + " — " + k.gram + " g " + k.yemek +
        " — " + k.kalori + " kcal, " + k.protein + " g protein";
      const btn = document.createElement("button");
      btn.textContent = "Sil";
      btn.dataset.idx = i;
      btn.addEventListener("click", function () {
        const hepsi2 = kayitlariAl();
        hepsi2.splice(parseInt(this.dataset.idx), 1);
        kayitlariKaydet(hepsi2);
        listeyiCiz();
      });
      li.appendChild(btn);
      gunListesi.appendChild(li);
    }
    if (!gunListesi.children.length) {
      gunListesi.innerHTML = "<i>Henüz bir şey eklemedin.</i>";
    }
  }

  // Yeni kayıt eklenince liste kendiliğinden yenilensin:
  // mevcut "ekle" fonksiyonunu sarmalıyoruz (kodu değiştirmeye gerek yok)
  const orijinalEkle = ekle;
  ekle = function (ad, gram) {
    const s = orijinalEkle(ad, gram);
    listeyiCiz();
    return s;
  };

  // Sayfa açılınca bugünün listesini göster
  listeyiCiz();
</script>
<script>
  // ---- GÜNLÜK ÖZET ----
  const ozetKal = document.getElementById("ozetKal");
  const ozetPro = document.getElementById("ozetPro");

  function ozetCiz() {
    const b = bugun();
    let kal = 0, pro = 0;
    for (const k of kayitlariAl()) {
      if (k.tarih !== b) continue;
      kal += k.kalori;
      pro += k.protein;
    }
    ozetKal.textContent = Math.round(kal);
    ozetPro.textContent = Math.round(pro * 10) / 10;
  }

  // Liste her çizildiğinde (ekleme/silme) özet de kendiliğinden güncellensin
  const orijinalCiz = listeyiCiz;
  listeyiCiz = function () {
    orijinalCiz();
    ozetCiz();
  };

  // Sayfa açılınca da hesapla
  ozetCiz();
</script>
<script>
  // ---- GÜNÜN TARİHİ VE SAATİ ----
  const tarihSaat = document.getElementById("tarihSaat");

  function tarihYaz() {
    const simdiki = new Date();
    const gun = simdiki.toLocaleDateString("tr-TR", {
      weekday: "long", day: "numeric", month: "long", year: "numeric"
    });
    const saat = simdiki.toLocaleTimeString("tr-TR", {
      hour: "2-digit", minute: "2-digit"
    });
    tarihSaat.textContent = gun + " · " + saat;
  }

  tarihYaz();
  setInterval(tarihYaz, 30000);
</script>
