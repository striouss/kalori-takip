<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">

  <title>Kalori Takip</title>
  <style>
  @font-face {
    font-family: "Panforte Serif";
    src: url("panforte_serif_regular.ttf");
  }
  body {
    font-family: "Panforte Serif", serif;
    background: #faf7f2;
    color: #3d2f23;
    padding: 16px;
    max-width: 480px;
    margin: 0 auto;
  }
  button {
    background-color: #C19A6B;
    color: #ffffff;
    border: none;
    border-radius: 14px;
    padding: 8px 16px;
    font-family: inherit;
    font-size: 15px;
    cursor: pointer;
  }
  input[type="text"], input[type="number"], select {
    border: 2px solid #C19A6B;
    border-radius: 14px;
    padding: 8px 12px;
    font-family: inherit;
    font-size: 15px;
    background: #ffffff;
    color: inherit;
  }
  input:focus, select:focus {
    outline: none;
    box-shadow: 0 0 0 2px rgba(193,154,107,0.35);
  }
  /* ---- Yeni bolumler ---- */
  .hedefKarti {
    background: #ffffff;
    border: 2px solid #C19A6B;
    border-radius: 14px;
    padding: 12px;
    margin-bottom: 12px;
  }
  .hedefSatir {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .barZemin {
    flex: 1;
    height: 12px;
    background: #efe6d9;
    border-radius: 6px;
    overflow: hidden;
  }
  .barDolgu {
    height: 100%;
    background: #C19A6B;
    border-radius: 6px;
    width: 0%;
  }
  .barEtiket {
    font-size: 13px;
    color: #8a7561;
    white-space: nowrap;
  }
  #hedefGirisi {
    display: none;
    margin-top: 10px;
    gap: 8px;
  }
  #hedefGirisi input {
    width: 90px;
  }
  .hizliBaslik {
    margin: 14px 0 6px 0;
    font-size: 15px;
    color: #8a7561;
  }
  #hizliKutusu {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 12px;
  }
  #hizliKutusu button {
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 14px;
  }
  #makroSatiri {
    display: flex;
    gap: 10px;
    margin-top: 6px;
    font-size: 14px;
  }
  #makroSatiri div {
    flex: 1;
    background: #ffffff;
    border: 2px solid #C19A6B;
    border-radius: 14px;
    padding: 6px 8px;
    text-align: center;
  }
</style>
</head>
<body>
  <h1>Kalori Takip</h1>
  <div id="ozet" style="padding:12px;background:#e8f5e9;border-radius:10px;margin-bottom:12px">
    <span id="ozetKal" style="font-size:28px;font-weight:bold">0</span> kcal
    &nbsp;·&nbsp;
    <span id="ozetPro" style="font-size:28px;font-weight:bold">0</span> g protein
    <div id="makroSatiri">
      <div><b id="ozetKarb">0</b> g karb</div>
      <div><b id="ozetYag">0</b> g yağ</div>
    </div>
  </div>
  <div class="hedefKarti">
    <div class="hedefSatir">
      <span class="barEtiket">kalori</span>
      <div class="barZemin"><div class="barDolgu" id="barKal"></div></div>
      <span class="barEtiket" id="barKalYazi">0 / 2000</span>
    </div>
    <div class="hedefSatir" style="margin-top:6px">
      <span class="barEtiket">protein</span>
      <div class="barZemin"><div class="barDolgu" id="barPro"></div></div>
      <span class="barEtiket" id="barProYazi">0 / 100</span>
    </div>
    <div style="text-align:right;margin-top:6px">
      <button id="hedefBtn" style="font-size:12px;padding:4px 10px">Hedef belirle</button>
    </div>
    <div id="hedefGirisi">
      <input id="hedefKal" type="number" placeholder="kcal hedefi">
      <input id="hedefPro" type="number" placeholder="protein hedefi">
      <button id="hedefKaydet" style="font-size:12px;padding:4px 10px">Kaydet</button>
    </div>
  </div>
  <input id="giris" type="text" placeholder="Örnek: 200 gr salatalık yedim" size="32">
  <button id="ekleBtn">Ekle</button>
  <p id="sonuc"></p>
  <p class="hizliBaslik">Sık eklediklerin</p>
  <div id="hizliKutusu"></div>
  <div id="manuelForm" style="display:none">
    <p>Bu yemeği tanımadım — listeden seç:</p>
    <select id="secYemek"></select>
    <input id="secGram" type="number" placeholder="gram" style="width:90px">
    <button id="manuelBtn">Ekle</button>
    <div id="yeniSatir" style="display:none">
      <input id="yeniAd" type="text" placeholder="yeni yemek adı">
      <input id="yeniKal" type="number" placeholder="kalori (100 gramda)" style="width:150px">
      <input id="yeniPro" type="number" placeholder="protein (100 gramda)" style="width:150px">
    </div>
  </div>
    <h2>Bugün yediklerim</h2>
      <p id="tarihSaat" style="margin-top:4px;color:#8a7561"></p>
  <ul id="gunListesi"></ul>
</body>

<script>
  // ---- YARDIMCILAR ----
  // Türkçe harfleri sadeleştir: "salatalık" -> "salatalik" (eşleşme için)
  function duzelt(metin) {
    return metin.toLocaleLowerCase("tr")
      .replace(/ç/g, "c")
      .replace(/ğ/g, "g")
      .replace(/ı/g, "i")
      .replace(/ö/g, "o")
      .replace(/ş/g, "s")
      .replace(/ü/g, "u");
  }

  // 1 adet/kase/bardak ≈ kaç gram (tablosu olmayanda 100 gram varsayar)
  const ADET_GRAM = {
    "yumurta": 50,
    "muz": 120,
    "elma": 150,
    "simit": 100,
    "kola": 250,
    "domates": 120,
    "salatalık": 100,
    "süt": 200,
    "yoğurt": 200,
    "ayran": 200,
    "mercimek çorbası": 250
  };

  function bugun() {
    const d = new Date();
    return d.getFullYear() + "-" +
      String(d.getMonth() + 1).padStart(2, "0") + "-" +
      String(d.getDate()).padStart(2, "0");
  }

  function kayitlariAl() {
    return JSON.parse(localStorage.getItem("kaloriKayitlari") || "[]");
  }

  function kayitlariKaydet(liste) {
    localStorage.setItem("kaloriKayitlari", JSON.stringify(liste));
  }

  function ozelYemekleriAl() {
    return JSON.parse(localStorage.getItem("ozelYemekler") || "{}");
  }

  // Gömülü liste + sonradan eklediklerin
  function tumYemekler() {
    return Object.assign({}, YEMEKLER, ozelYemekleriAl());
  }

  // Kayda ekle, hesabı döndür
  function ekle(ad, gram) {
    const deger = tumYemekler()[ad];
    const kalori = Math.round(deger[0] * gram / 100);
    const protein = Math.round(deger[1] * gram / 100 * 10) / 10;
    const liste = kayitlariAl();
    const karb = Math.round((deger[2] || 0) * gram / 100);
    const yag = Math.round((deger[3] || 0) * gram / 100);
    liste.push({
      tarih: bugun(),
      saat: new Date().toTimeString().slice(0, 5),
      yemek: ad,
      gram: gram,
      kalori: kalori,
      protein: protein,
      karb: karb,
      yag: yag
    });
    kayitlariKaydet(liste);
    return { kalori: kalori, protein: protein };
  }

  // ---- AKILLI GİRİŞ ----
  const giris = document.getElementById("giris");
  const sonuc = document.getElementById("sonuc");

  // Metindeki yemek adını bul (en uzun eşleşme kazanır)
  function yemekBul(metin) {
    const m = duzelt(metin);
    const adlar = Object.keys(tumYemekler()).sort(function (a, b) {
      return b.length - a.length;
    });
    for (const ad of adlar) {
      if (m.includes(duzelt(ad))) return ad;
    }
    return null;
  }

  function akilliEkle() {
    let metin = giris.value.toLocaleLowerCase("tr").replace(/\bbir\b/g, "1");
    sonuc.textContent = "";
    if (!metin.trim()) return;

    const sayiM = metin.match(/\d+/);
    if (!sayiM) {
      sonuc.textContent = "Miktar bulamadım. Örnek: 200 gr salatalık yedim";
      return;
    }
    const miktar = parseInt(sayiM[0]);

    const ad = yemekBul(metin);
    if (!ad) {
      manuelAc(giris.value);
      return;
    }

    // KURAL: "gr/gram" veya birim yoksa HER ZAMAN gram ("20 salatalık" = 20 g).
    // Birim kelimesi varsa (adet/tane/fincan/bardak/dilim/kase/kaşık) adet say:
    // "20 fincan kahve" = 20 x 100 g, "2 bardak süt" = 2 x 200 g.
    let gram = miktar;
    const adetYazilmis = /adet|tane|fincan|bardak|dilim|kase|kaşık/.test(metin);
    if (adetYazilmis) {
      gram = miktar * (ADET_GRAM[ad] || 100);
    }

    const s = ekle(ad, gram);
    sonuc.textContent = "✓ Eklendi: " + gram + " g " + ad + " — " + s.kalori + " kcal, " + s.protein + " g protein";
    if (typeof hizliEkle === "function") hizliEkle(ad, gram);
    giris.value = "";
  }

  document.getElementById("ekleBtn").addEventListener("click", akilliEkle);
  giris.addEventListener("keydown", function (e) {
    if (e.key === "Enter") akilliEkle();
  });

  // ---- TANINMAYAN YEMEK: MANUEL FORM ----
  const manuelForm = document.getElementById("manuelForm");
  const secYemek = document.getElementById("secYemek");
  const secGram = document.getElementById("secGram");
  const yeniSatir = document.getElementById("yeniSatir");
  const yeniAd = document.getElementById("yeniAd");
  const yeniKal = document.getElementById("yeniKal");
  const yeniPro = document.getElementById("yeniPro");

  function secListesiniYenile() {
    secYemek.innerHTML = "";
    const adlar = Object.keys(tumYemekler()).sort(function (a, b) {
      return a.localeCompare(b, "tr");
    });
    for (const ad of adlar) {
      const o = document.createElement("option");
      o.value = ad;
      o.textContent = ad;
      secYemek.appendChild(o);
    }
    const y = document.createElement("option");
    y.value = "__yeni__";
    y.textContent = "— Listede yok, yeni yemek ekleyeceğim —";
    secYemek.appendChild(y);
  }

  function yeniAcKapa() {
    yeniSatir.style.display = secYemek.value === "__yeni__" ? "block" : "none";
  }

  function manuelAc(orijinalMetin) {
    secListesiniYenile();
    yeniAcKapa();
    const s = orijinalMetin.match(/\d+/);
    secGram.value = s ? s[0] : "";
    manuelForm.style.display = "block";
    sonuc.textContent = "Bu yemeği tanımadım — aşağıdan seç:";
  }

  secYemek.addEventListener("change", yeniAcKapa);
  secGram.addEventListener("keydown", function (e) {
    if (e.key === "Enter") document.getElementById("manuelBtn").click();
  });

  document.getElementById("manuelBtn").addEventListener("click", function () {
    const gram = parseInt(secGram.value);
    if (!gram) {
      sonuc.textContent = "Gram değerini yaz.";
      return;
    }
    let ad;
    if (secYemek.value === "__yeni__") {
      ad = yeniAd.value.trim().toLocaleLowerCase("tr");
      const kal = parseFloat(yeniKal.value);
      const pro = parseFloat(yeniPro.value);
      if (!ad || isNaN(kal)) {
        sonuc.textContent = "Yeni yemek için ad ve kalori gerekli.";
        return;
      }
      const ozel = ozelYemekleriAl();
      ozel[ad] = [kal, isNaN(pro) ? 0 : pro];
      localStorage.setItem("ozelYemekler", JSON.stringify(ozel));
    } else {
      ad = secYemek.value;
    }
    const s = ekle(ad, gram);
    sonuc.textContent = "✓ Eklendi: " + gram + " g " + ad + " — " + s.kalori + " kcal, " + s.protein + " g protein";
    if (typeof hizliEkle === "function") hizliEkle(ad, gram);
    manuelForm.style.display = "none";
    giris.value = "";
  });
</script>
<script>
  // ---- GÜNÜN LİSTESİ ----
  const gunListesi = document.getElementById("gunListesi");

  function listeyiCiz() {
    const hepsi = kayitlariAl();
    const b = bugun();
    gunListesi.innerHTML = "";
    for (let i = 0; i < hepsi.length; i++) {
      const k = hepsi[i];
      if (k.tarih !== b) continue;
      const li = document.createElement("li");
      li.textContent = k.saat + " — " + k.gram + " g " + k.yemek +
        " — " + k.kalori + " kcal, " + k.protein + " g protein";
      const btn = document.createElement("button");
      btn.textContent = "Sil";
      btn.dataset.idx = i;
      btn.addEventListener("click", function () {
        const hepsi2 = kayitlariAl();
        hepsi2.splice(parseInt(this.dataset.idx), 1);
        kayitlariKaydet(hepsi2);
        listeyiCiz();
      });
      li.appendChild(btn);
      gunListesi.appendChild(li);
    }
    if (!gunListesi.children.length) {
      gunListesi.innerHTML = "<i>Henüz bir şey eklemedin.</i>";
    }
  }

  // Yeni kayıt eklenince liste kendiliğinden yenilensin:
  // mevcut "ekle" fonksiyonunu sarmalıyoruz (kodu değiştirmeye gerek yok)
  const orijinalEkle = ekle;
  ekle = function (ad, gram) {
    const s = orijinalEkle(ad, gram);
    listeyiCiz();
    return s;
  };

  // Sayfa açılınca bugünün listesini göster
  listeyiCiz();
</script>
<script>
  // ---- GÜNLÜK ÖZET ----
  const ozetKal = document.getElementById("ozetKal");
  const ozetPro = document.getElementById("ozetPro");

  function hedefleriAl() {
    return JSON.parse(localStorage.getItem("hedefler") || '{"kalori":2000,"protein":100}');
  }

  function ozetCiz() {
    const b = bugun();
    let kal = 0, pro = 0, karb = 0, yag = 0;
    for (const k of kayitlariAl()) {
      if (k.tarih !== b) continue;
      kal += k.kalori;
      pro += k.protein;
      karb += (k.karb || 0);
      yag += (k.yag || 0);
    }
    ozetKal.textContent = Math.round(kal);
    ozetPro.textContent = Math.round(pro * 10) / 10;
    document.getElementById("ozetKarb").textContent = Math.round(karb);
    document.getElementById("ozetYag").textContent = Math.round(yag);

    const h = hedefleriAl();
    const pk = Math.min(100, Math.round(kal / h.kalori * 100));
    const pp = Math.min(100, Math.round(pro / h.protein * 100));
    document.getElementById("barKal").style.width = pk + "%";
    document.getElementById("barPro").style.width = pp + "%";
    document.getElementById("barKalYazi").textContent =
      Math.round(kal) + " / " + h.kalori + " (" + pk + "%)";
    document.getElementById("barProYazi").textContent =
      Math.round(pro * 10) / 10 + " / " + h.protein + " (" + pp + "%)";
  }

  // Hedef girisi
  const hedefBtn = document.getElementById("hedefBtn");
  const hedefGirisi = document.getElementById("hedefGirisi");
  hedefBtn.addEventListener("click", function () {
    const h = hedefleriAl();
    document.getElementById("hedefKal").value = h.kalori;
    document.getElementById("hedefPro").value = h.protein;
    hedefGirisi.style.display = hedefGirisi.style.display === "block" ? "none" : "block";
  });
  document.getElementById("hedefKaydet").addEventListener("click", function () {
    const k = parseInt(document.getElementById("hedefKal").value);
    const p = parseInt(document.getElementById("hedefPro").value);
    if (!k || k < 500) {
      sonuc.textContent = "Kalori hedefi en az 500 olmalı.";
      return;
    }
    localStorage.setItem("hedefler", JSON.stringify({
      kalori: k,
      protein: p || 100
    }));
    hedefGirisi.style.display = "none";
    ozetCiz();
    sonuc.textContent = "✓ Hedefler kaydedildi.";
  });

  // Liste her çizildiğinde (ekleme/silme) özet de kendiliğinden güncellensin
  const orijinalCiz = listeyiCiz;
  listeyiCiz = function () {
    orijinalCiz();
    ozetCiz();
  };

  // Sayfa açılınca da hesapla
  ozetCiz();
</script>
<script>
  // ---- GÜNÜN TARİHİ VE SAATİ ----
  const tarihSaat = document.getElementById("tarihSaat");

  function tarihYaz() {
    const simdiki = new Date();
    const gun = simdiki.toLocaleDateString("tr-TR", {
      weekday: "long", day: "numeric", month: "long", year: "numeric"
    });
    const saat = simdiki.toLocaleTimeString("tr-TR", {
      hour: "2-digit", minute: "2-digit"
    });
    tarihSaat.textContent = gun + " · " + saat;
  }

  tarihYaz();
  setInterval(tarihYaz, 30000);
</script>
<script>
  // ---- HIZLI TEKRAR EKLEME (son 8 benzersiz) ----
  const hizliKutusu = document.getElementById("hizliKutusu");

  function hizliKayitlariAl() {
    return JSON.parse(localStorage.getItem("hizliYemekler") || "[]");
  }

  // en ondegram: {ad, gram} — akilliEkle ve manuel ekleme sonrasi cagirilir
  function hizliEkle(ad, gram) {
    let liste = hizliKayitlariAl();
    liste = liste.filter(function (h) { return h.ad !== ad || h.gram !== gram; });
    liste.unshift({ ad: ad, gram: gram });
    localStorage.setItem("hizliYemekler", JSON.stringify(liste.slice(0, 8)));
    hizliCiz();
  }

  function hizliCiz() {
    hizliKutusu.innerHTML = "";
    const liste = hizliKayitlariAl();
    for (const h of liste) {
      const btn = document.createElement("button");
      btn.textContent = h.ad + " " + h.gram + " g";
      btn.addEventListener("click", function () {
        const s = ekle(h.ad, h.gram);
        sonuc.textContent = "✓ Eklendi: " + h.gram + " g " + h.ad +
          " — " + s.kalori + " kcal, " + s.protein + " g protein";
      });
      hizliKutusu.appendChild(btn);
    }
  }

  hizliCiz();
</script>

</html>
